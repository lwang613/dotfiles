# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# don't rename windows automatically
set-option -g allow-rename off

# Silence all bells and notifications (stops annoying flashes/beeps)
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Highlight active split screen (inactive = red, active = bright yellow)
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# Status bar layout and colors
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red bg=default'

# Right side of status bar: Date and Time
set -g status-right-style 'fg=black bg=yellow'
set -g status-right ' %Y-%m-%d %H:%M '
set -g status-right-length 50

# Active window tab highlighting
setw -g window-status-current-style 'fg=black bg=red bold'
setw -g window-status-current-format ' #I #W #F '

# Text highlighting in copy/scroll mode
setw -g mode-style 'fg=black bg=red bold'


